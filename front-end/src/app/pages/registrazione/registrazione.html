<section class="scheda pagina-stretta">
  <h1>Crea il tuo account</h1>
  <form [formGroup]="form" (ngSubmit)="registra()">
    <div class="campo">
      <label for="username">Username</label>
      <input id="username" formControlName="username" autocomplete="username">
      <span class="suggerimento">3-50 caratteri: lettere, numeri, punto, trattino, underscore.</span>
    </div>
    <div class="campo">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="email">
    </div>
    <div class="campo">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" autocomplete="new-password">
      <span class="suggerimento">Almeno 8 caratteri.</span>
    </div>
    @if (errore(); as messaggio) {
      <p class="errore" role="alert">{{ messaggio }}</p>
    }
    <button class="pulsante" type="submit" [disabled]="form.invalid || inCorso()">Registrati</button>
  </form>
  <p class="tenue">Hai già un account? <a routerLink="/login">Accedi</a></p>
</section>
