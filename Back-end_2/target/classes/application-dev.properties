spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/il_mister?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootroot}

# Lo schema lo crea Flyway, Hibernate si limita a verificarlo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true

logging.level.com.ilmister=DEBUG

# Strumenti di sviluppo (anteprima dei campionati): solo in sviluppo
app.sviluppo.abilitato=true

# Solo per lo sviluppo locale: in produzione il segreto e' obbligatoriamente quello di JWT_SECRET
app.jwt.secret=${JWT_SECRET:segreto-solo-per-sviluppo-locale-non-usare-mai-in-produzione}
