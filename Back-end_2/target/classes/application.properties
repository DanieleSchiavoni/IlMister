spring.application.name=il-mister
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# La 8080 e la 8081 sono gia usate (altre applicazioni e Personal Finance)
server.port=${SERVER_PORT:8082}

# Evita query lazy "nascoste" nel livello web
spring.jpa.open-in-view=false

spring.jackson.time-zone=UTC
spring.mvc.format.date=iso

spring.datasource.url=jdbc:mysql://localhost:3306/il_mister
spring.datasource.username=root
spring.datasource.password=rootroot
# --- Sicurezza ---
# Il segreto (almeno 32 caratteri) arriva sempre da fuori: variabile d'ambiente JWT_SECRET
app.jwt.secret=${JWT_SECRET:}
app.jwt.durata-access-minuti=15
app.jwt.durata-refresh-giorni=14
# Origini del front-end ammesse (separate da virgola)
app.cors.origini-consentite=${CORS_ORIGINI:http://localhost:4200}

# Documentazione delle API: /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
